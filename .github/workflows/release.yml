name: Release

# Loest den Workflow aus, sobald ein Git-Tag im Format "v1.0.0" (SemVer mit "v"-Praefix) gepusht wird,
# z.B. per: git tag v1.0.0 && git push origin v1.0.0
# Alternativ manuell ueber die GitHub-UI ("Run workflow") auf einem beliebigen Branch startbar,
# z.B. zum Testen, ohne dafuer extra einen Tag anlegen zu muessen.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Erforderlich, damit der Workflow ein GitHub Release anlegen und Dateien daran anhaengen darf.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Voller Verlauf inkl. aller Tags statt des Standard-Shallow-Checkouts (fetch-depth: 1) - stellt
          # sicher, dass "git describe --tags --exact-match" (siehe Directory.Build.targets) beim Build
          # zuverlaessig den auslösenden Tag findet, unabhaengig vom genauen Checkout-Verhalten von
          # actions/checkout fuer Tag-Pushes.
          fetch-depth: 0

      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Abhaengigkeiten wiederherstellen
        run: dotnet restore

      # Erzeugt die self-contained Single-File-EXE (siehe VirtualController.App.csproj:
      # RuntimeIdentifier=win-x64, SelfContained=true, PublishSingleFile=true). Das dortige
      # "CopyPublishedExeToRepoRoot"-Target kopiert das Ergebnis zusaetzlich ins Repo-Root -
      # fuer den Workflow selbst massgeblich ist aber der PublishDir-Pfad unten.
      - name: Release-Build veroeffentlichen (self-contained win-x64 EXE)
        run: dotnet publish src/VirtualController.App/VirtualController.App.csproj -c Release -r win-x64 --self-contained true

      # Die WPF-nativen Interop-DLLs (D3DCompiler_47_cor3.dll, PenImc_cor3.dll, PresentationNative_cor3.dll,
      # vcruntime140_cor3.dll, wpfgfx_cor3.dll) koennen bei PublishSingleFile nicht ins Bundle eingebettet
      # werden und muessen als separate Dateien neben der EXE liegen (siehe README.md) - werden daher
      # zusammen mit der EXE in ein eigenes Verzeichnis kopiert, aus dem anschliessend das Release-Archiv
      # gepackt wird.
      - name: Release-Ordner zusammenstellen
        shell: pwsh
        run: |
          $publishDir = "src/VirtualController.App/bin/Release/net8.0-windows/win-x64/publish"
          $stagingDir = "release-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item "$publishDir/VirtualController.exe" -Destination $stagingDir
          Copy-Item "D3DCompiler_47_cor3.dll" -Destination $stagingDir
          Copy-Item "PenImc_cor3.dll" -Destination $stagingDir
          Copy-Item "PresentationNative_cor3.dll" -Destination $stagingDir
          Copy-Item "vcruntime140_cor3.dll" -Destination $stagingDir
          Copy-Item "wpfgfx_cor3.dll" -Destination $stagingDir
          Compress-Archive -Path "$stagingDir/*" -DestinationPath "VirtualController-win-x64.zip"

      # Ermittelt, ob der gepushte Tag einen SemVer-PreRelease-Suffix enthaelt (z.B. "v1.2.0-alpha",
      # "v1.2.0-beta", "v1.2.0-nightly") - solche Releases werden weiter unten automatisch mit dem
      # GitHub-Label "Pre-release" statt "Latest" versehen (siehe naechster Schritt), damit Nutzer klar
      # erkennen koennen, dass es sich nicht um eine vollwertige, stabile Version handelt.
      - name: Pre-Release-Status ermitteln
        id: prerelease_check
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = if ($tag -match '^v\d+\.\d+\.\d+-.+$') { 'true' } else { 'false' }
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Fasst alle Commit-Nachrichten seit dem vorherigen Tag (bzw. der gesamten Historie, falls es noch
      # keinen vorherigen Tag gibt) zu gruppierten Release Notes zusammen. Erwartet Commit-Nachrichten in
      # folgendem Format (mehrere solcher Bloecke pro Commit sind moeglich):
      #
      #   feature:
      #   - add versioncheck for version suffix e.g. alpha
      #   - add rollback to older versions
      #
      #   fix:
      #   - errorhandling
      #
      # Als Kopfzeile werden "feature:"/"features:"/"feat:" (-> "## Features") sowie "fix:"/"fixes:"
      # (-> "## Fixes") gleichbedeutend akzeptiert (case-insensitive), damit unterschiedliche im Team
      # verwendete Schreibweisen (z.B. "feat:" statt "features:") nicht zu uebersehenen Aufzaehlungspunkten
      # fuehren. Alle "-"-Aufzaehlungspunkte unterhalb einer solchen Kopfzeile werden ueber ALLE Commits im
      # Bereich hinweg gesammelt und zu genau einem "## Features"- bzw. "## Fixes"-Block zusammengefuehrt,
      # statt (wie bei generate_release_notes) einer reinen Commit-Liste. Commits ohne ein solches Format
      # tragen einfach nichts zu den Release Notes bei.
      - name: Release Notes aus Commit-Nachrichten gruppieren
        id: release_notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Ermittelt den naechstgelegenen Tag VOR dem aktuellen Commit (falls vorhanden) - der aktuelle,
          # gerade erst gepushte Tag selbst wird dabei bewusst ausgeschlossen (HEAD^ statt HEAD), damit
          # nur Commits SEIT dem vorherigen Release beruecksichtigt werden.
          git describe --tags --abbrev=0 "HEAD^" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              $previousTag = git describe --tags --abbrev=0 "HEAD^" 2>$null
          } else {
              $previousTag = $null
          }

          $logRange = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }

          # Ein fuehrendes NUL-Byte ("%x00") VOR jeder Commit-Nachricht (statt eines nachgestellten
          # Trennzeichens) markiert eindeutig den BEGINN jedes einzelnen Commits, unabhaengig davon, ob/wo
          # git selbst zusaetzliche Zeilenumbrueche zwischen den einzelnen Log-Eintraegen einfuegt - eine
          # rein nachgestellte Trennung hatte sich in der Praxis als zu fragil erwiesen und fuehrte dazu,
          # dass zuverlaessig nur der erste Commit im Bereich beruecksichtigt wurde. "Out-String" fasst die
          # von PowerShell automatisch in ein Zeilen-Array zerlegte Ausgabe wieder zu einem einzigen,
          # zusammenhaengenden Text zusammen, damit beim anschliessenden Aufteilen keine Zeilenumbrueche
          # verloren gehen oder versehentlich verschoben werden.
          $rawLog = (git log $logRange --pretty=format:"%x00%B" | Out-String)
          $commitBodies = $rawLog -split [char]0 | Where-Object { $_.Trim() -ne '' }

          $features = [System.Collections.Generic.List[string]]::new()
          $fixes = [System.Collections.Generic.List[string]]::new()

          foreach ($commitBody in $commitBodies) {
              $currentSection = $null
              foreach ($line in ($commitBody -split "`n")) {
                  $trimmed = $line.Trim()

                  # Kopfzeilen werden bewusst NICHT nur dann erkannt, wenn nach dem Doppelpunkt nichts
                  # weiter folgt (reines "feature:" auf einer eigenen Zeile) - in der Praxis vorkommende
                  # Commit-Nachrichten haben den ersten Punkt teils direkt in derselben Zeile wie die
                  # Kopfzeile (z.B. "feature: - add gamecontroller cpl") oder sogar ganz ohne
                  # "-"-Aufzaehlungszeichen (z.B. "fix: add missing slider axis"). Beide Formen werden hier
                  # gleichbedeutend behandelt: der Text nach dem Doppelpunkt wird - nach Entfernen eines
                  # optionalen fuehrenden "-" - direkt als erster Punkt des jeweiligen Abschnitts erfasst,
                  # $currentSection bleibt zusaetzlich fuer etwaige nachfolgende eigene "- ..."-Zeilen offen.
                  if ($trimmed -match '^(?i)(?:feature|features|feat)\s*:\s*(.*)$') {
                      $currentSection = 'feature'
                      $rest = ($Matches[1] -replace '^-\s*', '').Trim()
                      if ($rest -ne '') { $features.Add($rest) }
                      continue
                  }
                  if ($trimmed -match '^(?i)(?:fix|fixes)\s*:\s*(.*)$') {
                      $currentSection = 'fix'
                      $rest = ($Matches[1] -replace '^-\s*', '').Trim()
                      if ($rest -ne '') { $fixes.Add($rest) }
                      continue
                  }
                  if ($trimmed -eq '') {
                      # Bewusst NICHT den aktuellen Abschnitt zuruecksetzen: bei Commits mit mehreren
                      # "-m"-Flags (z.B. "git commit -m 'feature: - ...' -m '- ...' -m '- ...'") fuegt Git
                      # zwischen jedem "-m"-Absatz automatisch eine Leerzeile ein - ein reines
                      # Formatierungsartefakt, kein bewusster Abschnittswechsel. Ein tatsaechlicher
                      # Abschnittswechsel wird bereits explizit ueber die feature:/fix:-Kopfzeilen-Erkennung
                      # oben erfasst; wuerde die Leerzeile hier den Abschnitt zuruecksetzen, gingen alle
                      # nachfolgenden "-"-Aufzaehlungspunkte (aus weiteren "-m"-Absaetzen) verloren.
                      continue
                  }

                  if ($trimmed -match '^-\s*(.+)$') {
                      $item = $Matches[1].Trim()
                      if ($currentSection -eq 'feature') { $features.Add($item) }
                      elseif ($currentSection -eq 'fix') { $fixes.Add($item) }
                  } else {
                      # Eine Zeile, die weder eine Kopfzeile noch ein Aufzaehlungspunkt ist, beendet den
                      # aktuellen Abschnitt - verhindert, dass unstrukturierter Freitext faelschlich als
                      # Aufzaehlungspunkt interpretiert wird.
                      $currentSection = $null
                  }
              }
          }

          $bodyLines = [System.Collections.Generic.List[string]]::new()
          if ($features.Count -gt 0) {
              $bodyLines.Add('## Features')
              foreach ($item in $features) { $bodyLines.Add("- $item") }
              $bodyLines.Add('')
          }
          if ($fixes.Count -gt 0) {
              $bodyLines.Add('## Fixes')
              foreach ($item in $fixes) { $bodyLines.Add("- $item") }
              $bodyLines.Add('')
          }
          if ($bodyLines.Count -eq 0) {
              $bodyLines.Add('Keine kategorisierten Änderungen (feature:/feat:/fix: fehlen) in diesem Release.')
          }

          $bodyLines -join "`n" | Out-File -FilePath 'release-notes.md' -Encoding utf8

      - name: GitHub Release erstellen und Dateien anhaengen
        uses: softprops/action-gh-release@v2
        with:
          # Bewusst NUR das ZIP (EXE + alle benoetigten nativen DLLs, siehe README.md "Voraussetzungen")
          # als Anhang - nicht zusaetzlich die rohe EXE alleine, da die App ohne die DLLs nicht startet
          # und ein separater EXE-Download Nutzer sonst zu einer nicht lauffaehigen Datei verleiten wuerde.
          files: VirtualController-win-x64.zip
          # Der Tag-Name (z.B. "v1.0.0") wird automatisch als Release-Titel/-Version verwendet.
          # Verwendet die im vorherigen Schritt aus den Commit-Nachrichten gruppierten Release Notes
          # ("## Features" / "## Fixes") statt der von GitHub automatisch generierten reinen Commit-Liste.
          body_path: release-notes.md
          # Markiert Tags mit PreRelease-Suffix (z.B. "-alpha") automatisch als "Pre-release" statt
          # "Latest" (siehe Schritt "Pre-Release-Status ermitteln" oben).
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
