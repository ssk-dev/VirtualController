name: Release

# Triggers the workflow when a Git tag in the format "v1.0.0" (SemVer with a "v" prefix) is pushed,
# e.g. with: git tag v1.0.0 && git push origin v1.0.0
# It can also be started manually via the GitHub UI ("Run workflow") on any branch,
# e.g. for testing without creating a tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Required to allow the workflow to create a GitHub release and attach files.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history including all tags instead of the default shallow checkout (fetch-depth: 1).
          # This ensures "git describe --tags --exact-match" (see Directory.Build.targets) reliably finds
          # the triggering tag during the build, regardless of how actions/checkout handles tag pushes.
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # Creates the self-contained single-file executable (see VirtualController.App.csproj:
      # RuntimeIdentifier=win-x64, SelfContained=true, PublishSingleFile=true). The
      # "CopyPublishedExeToRepoRoot" target also copies the result to the repository root, but this workflow
      # uses the PublishDir path below.
      - name: Publish release build (self-contained win-x64 executable)
        run: dotnet publish src/VirtualController.App/VirtualController.App.csproj -c Release -r win-x64 --self-contained true

      # WPF native interop DLLs (D3DCompiler_47_cor3.dll, PenImc_cor3.dll, PresentationNative_cor3.dll,
      # vcruntime140_cor3.dll, wpfgfx_cor3.dll) cannot be bundled with PublishSingleFile and must sit next
      # to the executable (see README.md). Copy them together into a directory used to create the archive.
      - name: Assemble release directory
        shell: pwsh
        run: |
          $publishDir = "src/VirtualController.App/bin/Release/net8.0-windows/win-x64/publish"
          $stagingDir = "release-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item "$publishDir/VirtualController.exe" -Destination $stagingDir
          Copy-Item "D3DCompiler_47_cor3.dll" -Destination $stagingDir
          Copy-Item "PenImc_cor3.dll" -Destination $stagingDir
          Copy-Item "PresentationNative_cor3.dll" -Destination $stagingDir
          Copy-Item "vcruntime140_cor3.dll" -Destination $stagingDir
          Copy-Item "wpfgfx_cor3.dll" -Destination $stagingDir
          Compress-Archive -Path "$stagingDir/*" -DestinationPath "VirtualController-win-x64.zip"

      # Checks whether the pushed tag has a SemVer prerelease suffix (e.g. "v1.2.0-alpha",
      # "v1.2.0-beta", "v1.2.0-nightly"). Such releases are labeled "Pre-release" instead of "Latest"
      # below so users can distinguish them from stable versions.
      - name: Determine prerelease status
        id: prerelease_check
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = if ($tag -match '^v\d+\.\d+\.\d+-.+$') { 'true' } else { 'false' }
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Groups all commit messages since the previous tag (or the entire history if there is no previous tag)
      # into release notes. Commit messages are expected in the following format (multiple blocks per commit
      # are supported):
      #
      #   feature:
      #   - add versioncheck for version suffix e.g. alpha
      #   - add rollback to older versions
      #
      #   fix:
      #   - errorhandling
      #
      # Headers "feature:"/"features:"/"feat:" (-> "## Features") and "fix:"/"fixes:" (-> "## Fixes") are
      # accepted as equivalents, case-insensitively, to support different team conventions without dropping
      # entries. All bullet points under these headers are collected across all commits and combined into one
      # "## Features" or "## Fixes" block, rather than a plain commit list as with generate_release_notes.
      # Commits that do not use this format do not contribute to the release notes.
      - name: Group release notes from commit messages
        id: release_notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Finds the nearest tag before the current commit, if one exists. The just-pushed tag is intentionally
          # excluded (HEAD^ instead of HEAD) so only commits since the previous release are included.
          git describe --tags --abbrev=0 "HEAD^" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              $previousTag = git describe --tags --abbrev=0 "HEAD^" 2>$null
          } else {
              $previousTag = $null
          }

          $logRange = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }

          # A leading NUL byte ("%x00") before each commit message marks the start of every commit, regardless
          # of whether or where Git inserts extra line breaks between log entries. A trailing separator proved
          # too fragile and caused only the first commit in the range to be processed reliably. Out-String
          # combines PowerShell's line-array output into one continuous string so splitting it later does not
          # lose or accidentally shift line breaks.
          $rawLog = (git log $logRange --pretty=format:"%x00%B" | Out-String)
          $commitBodies = $rawLog -split [char]0 | Where-Object { $_.Trim() -ne '' }

          $features = [System.Collections.Generic.List[string]]::new()
          $fixes = [System.Collections.Generic.List[string]]::new()

          foreach ($commitBody in $commitBodies) {
              $currentSection = $null
              foreach ($line in ($commitBody -split "`n")) {
                  $trimmed = $line.Trim()

                  # Headers are not restricted to a bare "feature:" on its own line. In practice, commit
                  # messages may put the first item on the same line (e.g. "feature: - add gamecontroller cpl")
                  # or omit the bullet marker (e.g. "fix: add missing slider axis"). Both forms are accepted:
                  # text after the colon becomes the first item after removing an optional leading "-", and
                  # $currentSection remains open for subsequent "- ..." lines.
                  if ($trimmed -match '^(?i)(?:feature|features|feat)\s*:\s*(.*)$') {
                      $currentSection = 'feature'
                      $rest = ($Matches[1] -replace '^-\s*', '').Trim()
                      if ($rest -ne '') { $features.Add($rest) }
                      continue
                  }
                  if ($trimmed -match '^(?i)(?:fix|fixes)\s*:\s*(.*)$') {
                      $currentSection = 'fix'
                      $rest = ($Matches[1] -replace '^-\s*', '').Trim()
                      if ($rest -ne '') { $fixes.Add($rest) }
                      continue
                  }
                  if ($trimmed -eq '') {
                      # Do not reset the current section here: for commits with multiple "-m" flags (e.g.
                      # "git commit -m 'feature: - ...' -m '- ...' -m '- ...'"), Git inserts a blank line
                      # between paragraphs. This is formatting, not an intentional section change. Actual
                      # section changes are detected by the feature:/fix: headers above; resetting here would
                      # discard later bullet points from additional "-m" paragraphs.
                      continue
                  }

                  if ($trimmed -match '^-\s*(.+)$') {
                      $item = $Matches[1].Trim()
                      if ($currentSection -eq 'feature') { $features.Add($item) }
                      elseif ($currentSection -eq 'fix') { $fixes.Add($item) }
                  } else {
                      # A line that is neither a header nor a bullet ends the current section, preventing
                      # unstructured free text from being misinterpreted as a list item.
                      $currentSection = $null
                  }
              }
          }

          $bodyLines = [System.Collections.Generic.List[string]]::new()
          if ($features.Count -gt 0) {
              $bodyLines.Add('## Features')
              foreach ($item in $features) { $bodyLines.Add("- $item") }
              $bodyLines.Add('')
          }
          if ($fixes.Count -gt 0) {
              $bodyLines.Add('## Fixes')
              foreach ($item in $fixes) { $bodyLines.Add("- $item") }
              $bodyLines.Add('')
          }
          if ($bodyLines.Count -eq 0) {
              $bodyLines.Add('No categorized changes (feature:/feat:/fix: headers) in this release.')
          }

          $bodyLines -join "`n" | Out-File -FilePath 'release-notes.md' -Encoding utf8

      - name: Create GitHub release and attach files
        uses: softprops/action-gh-release@v2
        with:
          # Attach only the ZIP (executable + required native DLLs; see README.md "Requirements"), not the
          # executable alone. The app cannot start without the DLLs, and a separate executable download
          # could mislead users into downloading a file that will not run.
          files: VirtualController-win-x64.zip
          # The tag name (e.g. "v1.0.0") is used automatically as the release title/version.
          # Use the release notes grouped from commit messages above ("## Features" / "## Fixes") instead of
          # GitHub's automatically generated plain commit list.
          body_path: release-notes.md
          # Automatically marks tags with a prerelease suffix (e.g. "-alpha") as "Pre-release" instead of
          # "Latest" (see the "Determine prerelease status" step above).
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
