name: Bug report
description: Report a problem with VirtualController
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information
        below as completely as possible - it helps a lot with reproducing the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Open ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the "Settings" tab, or in the title of the release you downloaded.
      placeholder: e.g. 1.4.2
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 10 22H2 / Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: devices
    attributes:
      label: Physical controller(s)/device(s) involved
      description: Brand/model and connection type (USB, Bluetooth, wireless dongle), if relevant.
      placeholder: e.g. Logitech X56, Xbox Series controller via Bluetooth

  - type: dropdown
    id: drivers
    attributes:
      label: Driver status
      description: Is ViGEmBus (and, if used, HidHide) installed and reported as available in the app?
      options:
        - "Yes, ViGEmBus (and HidHide, if used) are installed and detected"
        - "ViGEmBus is not detected/available"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/error messages
      description: Any error text shown in the app, or exceptions, if available.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (screenshots, profile JSON excerpts, etc.).
